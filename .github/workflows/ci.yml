name: Portfolio checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      # A non-secret, reserved example origin enables production metadata checks.
      # This workflow builds and tests only; it does not publish this site.
      NEXT_PUBLIC_SITE_URL: https://portfolio.example
      NEXT_PUBLIC_RESUME_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Check formatting
        run: npm run format:check
      - name: Check TypeScript
        run: npm run typecheck
      - name: Test content and configuration contracts
        run: npm run test:unit
      - name: Build production export
        run: npm run build
      - name: Test the production site
        run: npm run test:e2e
      - name: Upload browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portfolio-browser-reports
          path: |
            artifacts/playwright-report/
            artifacts/test-results/
            artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 14
