[project]
name = "siraj-server"
version = "0.1.0"
description = "Siraj local-first AI assistant engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "numpy>=2.0",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "keyring>=25",
  "psutil>=6",
  "pillow>=10",
  "pytesseract>=0.3.10",
  "anthropic>=1.0",
  "openai>=1.50",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "reportlab>=4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["model: needs a running Ollama with real models"]
